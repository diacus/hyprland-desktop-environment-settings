# Hyprpaper - wallpaper daemon
# See https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
# The wallpaper itself is NOT set here: scripts/wallpaper.sh applies
# HYPRLAND_WALLPAPER_PATH (per machine in local.conf) via IPC, so hosts can
# differ without touching this file.
# Hot-reload (no restart): hyprctl hyprpaper wallpaper '<monitor>,<path>,<fit_mode>'

splash = false
ipc = on