# Autostart processes
# See https://wiki.hypr.land/Configuring/Keywords/#exec

# The desktop chrome
exec-once = waybar
exec-once = dunst
exec-once = hyprpaper
exec-once = $scripts/wallpaper.sh  # applies HYPRLAND_WALLPAPER_PATH via IPC
exec-once = hypridle

# Authentication agent (ssh/sudo prompts from GUI apps)
exec-once = systemctl --user start hyprpolkitagent.service

# Tray applets
exec-once = nm-applet
exec-once = blueman-applet

# XDG autostart entries of the user's own choosing (GNOME shares this
# mechanism: ~/.config/autostart/*.desktop, e.g. Seafile). Scoped to the
# user dir on purpose — scanning the system dirs would duplicate
# nm-applet/blueman-applet here and drag in host-specific Ubuntu entries.
# App entries carry OnlyShowIn to gate themselves if they care.
exec-once = dex -a -s ~/.config/autostart/

# Clipboard persistence: keep CLIPBOARD alive after the source app exits.
# NOTE: do NOT replace this with `wl-paste --watch wl-copy` — it can race a
# selection transfer and re-set the clipboard empty/stale, breaking paste
# system-wide (observed with pgtk Emacs and plain wl-copy alike).
exec-once = command -v wl-clip-persist >/dev/null && wl-clip-persist 2>/dev/null