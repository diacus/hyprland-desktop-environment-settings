# Environment variables
# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,hyprland
env = XDG_SESSION_TYPE,wayland

# Cursors (session-scoped: GNOME sessions are unaffected; portal serves the
# shared dconf cursor-theme=default, which resolves to Adwaita)
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = HYPRCURSOR_THEME,Adwaita

# GTK apps: pick the toolkit backend
env = GDK_BACKEND,wayland,x11,*

# Qt apps follow the Qt theming (Kvantum/qt6ct) instead of GTK
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# Native Wayland for the big clients
env = MOZ_ENABLE_WAYLAND,1
env = SDL_VIDEODRIVER,wayland

# Portal: file dialogs and screencast come from the GTK portal
env = GTK_USE_PORTAL,1