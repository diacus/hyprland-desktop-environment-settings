# Look and feel - Nord
# See https://wiki.hypr.land/Configuring/Variables/

general {
    gaps_in = 4
    gaps_out = 10
    border_size = 2
    col.active_border = $nord8 $nord10 45deg
    col.inactive_border = $nord3
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.94

    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgba(2e3440aa)
    }

    blur {
        enabled = true
        size = 4
        passes = 2
        vibrancy = 0.17
    }
}

animations {
    enabled = yes

    bezier = quick       , 0.15, 0.0,  0.10, 1
    bezier = gliding     , 0.05, 0.7,  0.10, 1
    bezier = almostLinear, 0.50, 0.5,  0.75, 1

    animation = windows    , 1, 4,    gliding      , slide
    animation = windowsIn  , 1, 3,    quick        , popin 90%
    animation = windowsOut , 1, 2,    quick        , popin 90%
    animation = fade       , 1, 2,    quick
    animation = workspaces , 1, 2,    almostLinear , fade
    animation = layers     , 1, 2,    almostLinear , fade
    animation = border     , 1, 3,    quick
}

# XWayland apps can't do fractional scaling; render them 1:1 so their text
# is crisp (their UI will look 1x-sized on this panel). Native Wayland apps
# still scale fractionally.
xwayland {
    force_zero_scaling = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    vfr = true                          # only repaint when needed, saves battery
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    font_family = Ubuntu Sans
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    # Nested test runs (scripts/live-test.sh) legitimately bypass the session
    # wrapper; in a real session GDM starts Hyprland through start-hyprland.
    disable_watchdog_warning = true
}

debug {
    # Keep Hyprland's own log populated (it dies with the runtime dir, but
    # scripts/live-test.sh captures its stdout too)
    disable_logs = false
}