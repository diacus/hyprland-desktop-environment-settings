# Window and workspace rules
# See https://wiki.hypr.land/Configuring/Window-Rules/
# Syntax note: Hyprland >= 0.46 uses named windowrule blocks with match: filters.

windowrule {
    # Ignore maximize requests from clunky apps
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    # Floating utilities: pavucontrol, nm-connection-editor, bluetooth-manager.
    # pattern matches the whole class; GTK4 apps report a flatpak-style
    # app-id (pavucontrol 6.x = org.pulseaudio.pavucontrol)
    name = float-settings-dialogs
    match:class = (org\.pulseaudio\.pavucontrol|pavucontrol|nm-connection-editor|blueman-manager|blueman-adapters)$
    float = on
    size = 800 560
    center = on
}

windowrule {
    # GTK question dialogs (zenity), e.g. the power-off/reboot
    # confirmation in scripts/powermenu.sh: float near the menu spot,
    # centered, with the dialog's own header bar as the only chrome.
    name = confirm-dialogs
    match:class = ^zenity$
    float = on
    center = on
    border_size = 0
}

windowrule {
    # Calendar popup, opened by clicking the waybar date widget
    # (scripts/calendar-popup.py). Stays up while focused on any
    # workspace; closing it needs no border or chrome.
    name = calendar-popup
    match:class = ^calendar-popup$
    float = on
    pin = on
    border_size = 0
}

windowrule {
    # Volume panel, opened by clicking the waybar volume widget
    # (scripts/volume-popup.py). Focusable, like calendar-popup: it
    # closes on focus loss; stays up on any workspace.
    name = volume-popup
    match:class = ^volume-popup$
    float = on
    pin = on
    border_size = 0
}

windowrule {
    # Transient volume OSD spawned by the XF86 volume keybinds
    # (scripts/volume-popup.py osd). Renders centered without ever
    # taking focus — the bound keys must keep working while an app or
    # game holds the keyboard, and there is deliberately no Escape path.
    name = volume-osd
    match:class = ^volume-osd$
    float = on
    pin = on
    border_size = 0
    no_focus = on
    center = on
}

# NOTE: Hyprland 0.53 has no `match:size` in windowrule blocks yet (open
# feature request, hyprwm/Hyprland#13106); small-floating-popup rules with
# `ontop` are not expressible in this version.