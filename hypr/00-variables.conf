# Variables and the Nord color palette
# See https://www.nordtheme.com/docs/colors-and-palettes

# Programs
$terminal = kitty
$fileManager = nautilus
$menu = rofi -show drun
$windows = rofi -show window
$power = $scripts/powermenu.sh
$scripts = ~/.config/hypr/scripts

# Key modifier
$mainMod = SUPER

# Nord palette (rgba with alpha ee = ~93% opacity)
$nord0  = rgba(2e3440ff)   # polar night, darkest
$nord3  = rgba(434c5eff)   # polar night, lighter
$nord4  = rgba(d8dee9ff)   # snow storm
$nord6  = rgba(eceff4ff)   # snow storm, brightest
$nord8  = rgba(88c0d0ff)   # frost, aurora teal
$nord10 = rgba(5e81acff)   # frost, blue
$nord11 = rgba(bf616aff)   # aurora, red
$nord12 = rgba(d08770ff)   # aurora, orange
$nord13 = rgba(ebcb8bff)   # aurora, yellow
$nord14 = rgba(a3be8cff)   # aurora, green
$nord15 = rgba(b48eaeff)   # aurora, purple