# Hyprland desktop environment - entry point
# This file is installed (copied) into ~/.config/hypr/hyprland.conf and
# pulls in the rest, so the whole setup stays under version control.
# See https://wiki.hypr.land/Configuring/

source = ~/.config/hypr/00-variables.conf
source = ~/.config/hypr/10-monitors.conf
source = ~/.config/hypr/20-env.conf
source = ~/.config/hypr/30-input.conf
source = ~/.config/hypr/40-looknfeel.conf
source = ~/.config/hypr/50-keybinds.conf
source = ~/.config/hypr/60-autostart.conf
source = ~/.config/hypr/70-windows.conf

# Per-machine settings (wallpaper path, host specifics); generated by
# setup-symlinks.sh with a template, never overwritten by the repo
source = ~/.config/hypr/local.conf