# Input devices
# See https://wiki.hypr.land/Configuring/Variables/#input
#
# Keyboard layout: two XKB states on the Apple SPI keyboard, cycled from the
# bar's language widget (switchxkblayout) so dead keys are opt-in per task:
#   us               — plain US, for code and shell
#   us + intl        — US with dead keys (' a = á, ~ n = ñ, " e = ë, ' c = ç),
#                      for Spanish/Portuguese; a literal quote needs ' + space.
# Both layouts share short name "us"; the widget shows {short}{variant} to
# tell them apart. Add more layouts by extending both lists in order.

input {
    kb_layout = us,us
    kb_variant =,intl

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        # MacBook trackpad
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
        clickfinger_behavior = true   # two-finger tap = right click
        scroll_factor = 0.5
    }
}

# Three-finger horizontal swipe switches workspaces
gesture = 3, horizontal, workspace