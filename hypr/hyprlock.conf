# Hyprlock - screen locker
# See https://wiki.hyprland.org/hyprlock/

# Nord palette
$text = rgba(eceff4ff)

general {
    no_fade_in = true
    grace = 0
    ignore_empty_input = true
}

# Blurred screenshot of the actual screen, so the lock matches what was there
background {
    monitor =
    path = screenshot
    blur_size = 400
    blur_passes = 3
    color = rgba(2e3440aa)
}

# Clock (Nord6 #ECEFF4 on dark, Ubuntu Sans)
label {
    monitor =
    text = cmd[update:20000] echo "$(date +'%H:%M')"
    color = $text
    font_size = 80
    font_family = Ubuntu Sans
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:18000000] echo "$(date +'%A, %d %B')"
    color = $text
    font_size = 26
    font_family = Ubuntu Sans
    position = 0, 140
    halign = center
    valign = center
}

# Password field (Nord border, teal ring when active)
input-field {
    monitor =
    size = 340, 60
    outline_thickness = 3
    dots_center = true
    dots_size = 0.25
    fade_on_empty = false
    placeholder_text = <i>Password…</i>
    # Nord0 fill, Nord3 border, Nord8 focus ring
    inner_color = rgba(2e3440dd)
    outer_color = rgba(434c5eff)
    check_color = rgba(a3be8cff)
    fail_color = rgba(bf616aff)
    font_color = rgba(eceff4ff)
    position = 0, -40
    halign = center
    valign = center
}