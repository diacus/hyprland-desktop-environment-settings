# Hypridle - idle daemon (screen dim, DPMS off, lock, suspend)
# See https://wiki.hyprland.org/hypridle/
# On a laptop this trades idle burn for a little fiddliness: tweak the timeouts.

general {
    # Hyprlock on any sleep/lock event
    before_sleep_cmd = hyprlock
    lock_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Dim the screen halfway after 3 min idle
listener {
    timeout = 180
    on-timeout = brightnessctl -e4 set 30%
    on-resume = brightnessctl -e4 -r
}

# Turn the panel off after 5 min idle
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 15 min idle (battery saver)
listener {
    timeout = 900
    on-timeout = systemctl suspend
}