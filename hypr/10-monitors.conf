# Monitors
# See https://wiki.hypr.land/Configuring/Monitors/
#
# The internal display, pinned after the first real session (see
# `hyprctl monitors`). Scale 1.67 keeps GNOME's density on this panel;
# auto-scale would pick 2.00 and yield a 1280x800 logical desktop.
monitor = eDP-1, 2560x1600, 0x0, 1.67
monitor = , preferred, auto, auto

# Workspaces 1-6 are always there, so the bar never reshuffles
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true
workspace = 6, persistent:true