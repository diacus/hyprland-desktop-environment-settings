# Keybindings
# See https://wiki.hypr.land/Configuring/Binds/
# MacBook F-keys emit their XF86 actions by default; fn inverts.

# --- Session, windows and programs -------------------------------------------
bind  = $mainMod, RETURN, exec, $terminal
bind  = $mainMod, Q, killactive,
bind  = $mainMod, V, togglefloating,
bind  = $mainMod, F, fullscreen,
bind  = $mainMod, P, pseudo,                     # dwindle pseudotile
bind  = $mainMod, J, togglesplit,                # dwindle split swap
bind  = $mainMod, space, exec, $menu             # application launcher
bind  = $mainMod, R, exec, $run                  # run arbitrary command
bind  = $mainMod, TAB, exec, $windows            # running apps / task list
bind  = $mainMod, E, exec, $fileManager
bind  = $mainMod SHIFT, M, exit,                 # leave Hyprland
bind  = $mainMod, L, exec, hyprlock              # lock screen
bind  = $mainMod SHIFT, E, exec, $power          # session menu

# --- Focus and movement ------------------------------------------------------
bind   = $mainMod, left, movefocus, l
bind   = $mainMod, right, movefocus, r
bind   = $mainMod, up, movefocus, u
bind   = $mainMod, down, movefocus, d
bindl  = $mainMod, mouse_down, workspace, e+1
bindl  = $mainMod, mouse_up, workspace, e-1
bindm  = $mainMod, mouse:272, movewindow
bindm  = $mainMod, mouse:273, resizewindow

# --- Workspaces --------------------------------------------------------------
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# --- Screenshots -------------------------------------------------------------
bind = , PRINT, exec, $scripts/screenshot.sh area
bind = SHIFT, PRINT, exec, $scripts/screenshot.sh full
bind = $mainMod, PRINT, exec, $scripts/screenshot.sh window

# --- Laptop keys: sound, brightness, media, sleep ----------------------------
# Volume keys report through a transient OSD (volume-popup.py osd): it
# re-reads the just-applied volume, never takes focus (see the volume-osd
# windowrule) so a game or app keeps the keyboard while keys repeat.
bindel  = ,XF86AudioRaiseVolume, exec, pamixer -i 5; $volumeOsd
bindel  = ,XF86AudioLowerVolume, exec, pamixer -d 5; $volumeOsd
bindl   = ,XF86AudioMute, exec, pamixer -t; $volumeOsd
bindl   = ,XF86AudioMicMute, exec, pamixer --default-source -t; $scripts/volume-mic-osd.sh
bindl   = ,XF86AudioPlay, exec, playerctl play-pause
bindl   = ,XF86AudioPause, exec, playerctl play-pause
bindl   = ,XF86AudioNext, exec, playerctl next
bindl   = ,XF86AudioPrev, exec, playerctl previous
bindel  = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel  = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl   = ,XF86Suspend, exec, hyprlock   # sleep key: suspend is broken on this host (see CLAUDE.md)

# Volume keys inside Firefox/Chromium (apps swallow them)
bindel  = ALT, XF86AudioRaiseVolume, exec, pamixer -i 5; $volumeOsd
bindel  = ALT, XF86AudioLowerVolume, exec, pamixer -d 5; $volumeOsd
bindl   = ALT, XF86AudioMute, exec, pamixer -t; $volumeOsd

# Utility dialogs close on ESC, session-wide and app-agnostic. Bind must
# be non-consuming (n): ESC is delivered to the focused app as well,
# toolkit dialogs (nm-connection-editor, zenity) self-close on it, and
# the script handles only the windows that don't (scripts/dialog-escape.sh)
bindn = , Escape, exec, $scripts/dialog-escape.sh