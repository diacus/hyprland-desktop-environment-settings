# systemd-logind: this desktop never sleeps, locks instead.
#
# Host "anahuac" (MBP 2017) wedges the kernel at the ACPI/SMC platform
# handoff of any suspend attempt (pm_test bisection 2026-10-20, see
# CLAUDE.md "Known quirks"). The sleep verbs are refused by
# system/sleep.conf.d/95-never-sleep.conf (Allow*=no lives there on systemd
# >= 259, not here); this file covers how the lid and sleep keys behave.
#
# Install to /etc/systemd/logind.conf.d/ (root), then
#   systemctl restart systemd-logind

[Login]
# lid close locks the screen: logind raises the Lock signal and hypridle's
# lock_cmd runs hyprlock (desktop stays up)
HandleLidSwitch=lock
HandleLidSwitchExternalPower=lock
# with an external monitor attached, closing the lid changes nothing at all
# (GNOME/logind default: ignore)
HandleLidSwitchDocked=ignore

# physical sleep / hibernate keys do nothing
HandleSuspendKey=ignore
HandleHibernateKey=ignore