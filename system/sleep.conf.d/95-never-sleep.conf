# systemd-sleep: refuse suspend and hibernate system-wide.
#
# Host "anahuac" (MBP 2017) wedges the kernel at the ACPI/SMC platform
# handoff of any suspend attempt (pm_test bisection 2026-10-20, see
# CLAUDE.md "Known quirks"); hibernation goes through the same handoff, so
# both are refused here. hypridle's suspend listener stays disabled too.
#
# NOTE: these keys live in sleep.conf, NOT logind.conf, on systemd >= 259 —
# logind.conf rejects them with "Unknown key" warnings.
#
# Install to /etc/systemd/sleep.conf.d/ (root), then
#   systemctl restart systemd-logind
# Verify: busctl call org.freedesktop.login1 /org/freedesktop/login1 \
#   org.freedesktop.login1.Manager CanSuspend   → expects "no"
#          ... CanHibernate → expects "no"

[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no